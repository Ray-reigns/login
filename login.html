<!DOCTYPE html>
<html>
  <head>
  <title>loginpage</title>
  </head>

  <body>
    <div class="login-card">
      <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue to your account</p>

      <div class="social-row">
        <button class="social google">
         <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
         Continue with Google
        </button>
        <button class="social apple">
          <svg viewBox="0 0 384 512" width="16" fill="white"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C59.3 141.2 0 184.8 0 241.2c0 26.2 10.5 54.1 32.8 89.2 22.2 35 40.8 73.8 70.2 72.2 27-1.4 37.4-17.3 78.7-17.3 40.6 0 48.4 17.3 76.2 16.9 28.7-.4 47-26.4 64.4-61.3 18.2-27.3 25.8-54.6 26.2-55.9-1.4-.9-50.1-19.2-50.8-76.2zM187.2 94c17.8-22 28.4-52.3 25.3-82.3-24.6 1-54.4 16.5-71.9 36.7-16 19.1-29.2 49.1-25.6 78 27.1 2.1 54.8-13.7 72.2-32.4z"/></svg>
          Continue with Apple
        </button>
      </div>

       <div class="input-group">
         <span class="icon">✉️</span>
         <input type="email" placeholder="Email address">
       </div>

       <div class="input-group">
          <span class="icon">🔒</span>
         <input type="password" placeholder="Password" id="pass">
         <span class="eye" onclick="pass.type = pass.type==='password'?'text':'password'">👁️</span>
       </div>

       <div class="row">
         <label><input type="checkbox"> Remember me</label>
         <a href="#">Forgot Password?</a>
       </div>

       <button class="login-btn">Login</button>

      <p class="bottom">Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </body>
</html>
